<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT QR Generator → PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            color: #0b1a33;
            margin-bottom: 5px;
        }

        .sub {
            color: #666;
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f2c47;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0b1a33;
        }

        .preview-row {
            background: #f7faff;
            padding: 10px 16px;
            border-radius: 12px;
            margin: 10px 0 16px;
            font-size: 0.85rem;
            border: 1px dashed #cbd5e6;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #0b1a33;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #142b4a;
        }

        .btn-secondary {
            background: #eef2f9;
            color: #0b1a33;
            margin-top: 10px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.ok {
            background: #eafaf1;
            border: 1px solid #2b7a4b;
        }

        .status.error {
            background: #fdeaea;
            border: 1px solid #b13e3e;
        }

        /* Скрытый элемент для рендеринга страниц */
        #pageTemplate {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 800px;
            height: 1131px;
            background: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        #pageTemplate .number {
            font-size: 280px;
            font-weight: bold;
            color: #0b1a33;
            line-height: 1;
            margin-bottom: 20px;
        }

        #pageTemplate .qr-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        #pageTemplate .qr-container canvas {
            width: 350px;
            height: 350px;
        }

        #pageTemplate .qr-code-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        #pageTemplate .name {
            font-size: 48px;
            font-weight: bold;
            color: #0b1a33;
            margin-top: 20px;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #8596b5;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .style-toggle {
            display: flex;
            gap: 12px;
            background: #f0f2f8;
            padding: 6px;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        .style-toggle button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f2c47;
        }

        .style-toggle button.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            color: #0b1a33;
        }

        .style-toggle button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬛ MRT PDF</h1>
        <div class="sub">Генерация PDF с QR-кодами</div>

        <!-- Переключатель стилей -->
        <div class="style-toggle" id="styleToggle">
            <button class="active" data-style="old">📜 Старый стиль</button>
            <button data-style="new">✨ Новый стиль</button>
        </div>

        <div class="form-group">
            <label>🔢 Код MRT</label>
            <input type="text" id="mrtCode" value="960302247">
        </div>

        <div class="form-group">
            <label>📄 Количество листов</label>
            <input type="number" id="sheetCount" value="3" min="1" max="20">
        </div>

        <div class="form-group">
            <label>📝 Наименование</label>
            <input type="text" id="userName" value="КС">
        </div>

        <div class="preview-row">
            Пример: <code id="examplePreview">SQUA960302247MRT1</code>
        </div>

        <button class="btn" id="generateBtn">📄 Сгенерировать PDF</button>
        <button class="btn btn-secondary" id="clearBtn">✕ Очистить</button>

        <div class="status" id="statusMessage"></div>
        <div class="footer">Работает полностью в браузере</div>
    </div>

    <!-- Скрытый шаблон для создания страниц -->
    <div id="pageTemplate">
        <div class="number" id="pageNumber">1</div>
        <div class="qr-container" id="qrContainer"></div>
        <div class="qr-code-text" id="qrText">SQUA960302247MRT1</div>
        <div class="name" id="pageName">КС</div>
    </div>

    <script>
        (function() {
            const mrtCodeInput = document.getElementById('mrtCode');
            const sheetCountInput = document.getElementById('sheetCount');
            const userNameInput = document.getElementById('userName');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusDiv = document.getElementById('statusMessage');
            const examplePreview = document.getElementById('examplePreview');
            const pageTemplate = document.getElementById('pageTemplate');
            const pageNumber = document.getElementById('pageNumber');
            const qrContainer = document.getElementById('qrContainer');
            const qrText = document.getElementById('qrText');
            const pageName = document.getElementById('pageName');

            // --- состояние стиля ---
            let currentStyle = 'old'; // 'old' или 'new'

            // переключатель
            const styleButtons = document.querySelectorAll('#styleToggle button');
            styleButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    styleButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStyle = this.dataset.style;
                    updatePreview();
                    // небольшая подсказка
                    showStatus(`Стиль: ${currentStyle === 'old' ? 'Старый (с добавками)' : 'Новый (только код)'}`, 'ok');
                });
            });

            // --- функции ---
            function showStatus(message, type = 'ok') {
                statusDiv.textContent = message;
                statusDiv.className = 'status show ' + type;
                setTimeout(() => { statusDiv.className = 'status'; }, 5000);
            }

            function getQRText(rawCode, index) {
                // index — номер листа (1-based)
                if (currentStyle === 'old') {
                    return `SQUA${rawCode}MRT${index}`;
                } else {
                    // новый стиль: просто введённый код без добавок
                    return rawCode;
                }
            }

            function updatePreview() {
                const code = mrtCodeInput.value.trim() || '960302247';
                const previewText = getQRText(code, 1);
                examplePreview.textContent = previewText;
            }

            mrtCodeInput.addEventListener('input', updatePreview);
            updatePreview();

            // генерация QR с переданным текстом
            function generateQR(text, container) {
                return new Promise((resolve) => {
                    container.innerHTML = '';
                    new QRCode(container, {
                        text: text,
                        width: 350,
                        height: 350,
                        colorDark: '#0b1a33',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    // даём время на отрисовку
                    setTimeout(resolve, 250);
                });
            }

            async function generatePDF() {
                const mrtCode = mrtCodeInput.value.trim();
                const sheetCount = parseInt(sheetCountInput.value) || 1;
                const userName = userNameInput.value.trim() || 'КС';

                if (!mrtCode) {
                    showStatus('❌ Введите код MRT', 'error');
                    return;
                }

                try {
                    showStatus('⏳ Генерация PDF...', 'ok');

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = 210;
                    const pageHeight = 297;

                    for (let i = 1; i <= sheetCount; i++) {
                        if (i > 1) doc.addPage();

                        // какой текст попадёт в QR и подпись
                        const fullCode = getQRText(mrtCode, i);

                        // Обновляем шаблон
                        pageNumber.textContent = String(i);
                        pageName.textContent = userName;
                        qrText.textContent = fullCode;

                        // Генерируем QR
                        await generateQR(fullCode, qrContainer);

                        // Конвертируем в canvas
                        const canvas = await html2canvas(pageTemplate, {
                            scale: 1.5,
                            useCORS: true,
                            logging: false,
                            width: 800,
                            height: 1131
                        });

                        // Добавляем в PDF
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        doc.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                    }

                    doc.save(`MRT_${mrtCode}.pdf`);
                    showStatus(`✅ PDF создан! (${sheetCount} листов, стиль: ${currentStyle})`, 'ok');

                } catch (error) {
                    console.error(error);
                    showStatus(`❌ Ошибка: ${error.message}`, 'error');
                }
            }

            function clearAll() {
                mrtCodeInput.value = '960302247';
                sheetCountInput.value = '3';
                userNameInput.value = 'КС';
                // сброс стиля на старый (по умолчанию)
                styleButtons.forEach(b => b.classList.remove('active'));
                document.querySelector('#styleToggle button[data-style="old"]').classList.add('active');
                currentStyle = 'old';
                updatePreview();
                showStatus('🧹 Очищено (старый стиль)', 'ok');
            }

            generateBtn.addEventListener('click', generatePDF);
            clearBtn.addEventListener('click', clearAll);

            document.querySelectorAll('input').forEach(el => {
                el.addEventListener('keydown', e => { if (e.key === 'Enter') generatePDF(); });
            });

            console.log('✅ Готово!');
        })();
    </script>
</body>
</html>
