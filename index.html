<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT QR Generator → PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            color: #0b1a33;
            margin-bottom: 5px;
        }

        .sub {
            color: #666;
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f2c47;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0b1a33;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .slider-group label {
            min-width: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f2c47;
            margin-bottom: 0;
        }

        .slider-group input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #dde3ed;
            border-radius: 3px;
            outline: none;
            padding: 0;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0b1a33;
            cursor: pointer;
        }

        .slider-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0b1a33;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            min-width: 45px;
            text-align: right;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0b1a33;
        }

        .slider-sum {
            font-size: 0.8rem;
            color: #666;
            text-align: right;
            margin-top: 2px;
            padding-right: 4px;
        }

        .slider-sum span {
            font-weight: 600;
            color: #0b1a33;
        }

        .preview-row {
            background: #f7faff;
            padding: 10px 16px;
            border-radius: 12px;
            margin: 10px 0 16px;
            font-size: 0.85rem;
            border: 1px dashed #cbd5e6;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #0b1a33;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #142b4a;
        }

        .btn-secondary {
            background: #eef2f9;
            color: #0b1a33;
            margin-top: 10px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.ok {
            background: #eafaf1;
            border: 1px solid #2b7a4b;
        }

        .status.error {
            background: #fdeaea;
            border: 1px solid #b13e3e;
        }

        /* ========== ШАБЛОН С РАЗМЕТКОЙ ========== */
        #pageTemplate {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 800px;
            height: 1131px;
            background: white;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: 'Aptos Narrow', 'Arial Narrow', Arial, sans-serif;
            border: none;
            outline: none;
        }

        #pageTemplate .zone-number {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            padding: 0 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #pageTemplate .zone-number .big-number {
            font-weight: 700;
            color: #0b1a33;
            line-height: 1;
            letter-spacing: -8px;
            text-align: center;
            width: 100%;
            transform: scaleX(1.05);
            font-family: 'Aptos Narrow', 'Arial Narrow', Arial, sans-serif;
            user-select: none;
            white-space: nowrap;
            font-size: 580px;
        }

        #pageTemplate .zone-qr {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 10px 20px;
            flex-shrink: 0;
        }

        #pageTemplate .zone-qr .qr-single {
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        #pageTemplate .zone-qr .qr-single canvas,
        #pageTemplate .zone-qr .qr-single img {
            width: 140px !important;
            height: 140px !important;
            display: block;
            background: transparent;
            border: none;
            outline: none;
        }

        #pageTemplate .zone-name {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 0 20px;
            flex-shrink: 0;
        }

        #pageTemplate .zone-name .page-name {
            font-size: 44px;
            font-weight: 600;
            color: #0b1a33;
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Aptos Narrow', 'Arial Narrow', Arial, sans-serif;
        }

        /* Подписи зон (видны в шаблоне, скрываются в PDF) */
        #pageTemplate .zone-label {
            position: absolute;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.6);
            padding: 2px 10px;
            border-radius: 4px;
            pointer-events: none;
            font-family: system-ui, sans-serif;
        }

        #pageTemplate .zone-number .zone-label {
            bottom: 6px;
            right: 12px;
        }

        #pageTemplate .zone-qr .zone-label {
            bottom: 4px;
            right: 12px;
            font-size: 10px;
        }

        #pageTemplate .zone-name .zone-label {
            bottom: 4px;
            right: 12px;
            font-size: 10px;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #8596b5;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .style-toggle {
            display: flex;
            gap: 12px;
            background: #f0f2f8;
            padding: 6px;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        .style-toggle button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f2c47;
        }

        .style-toggle button.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            color: #0b1a33;
        }

        .style-toggle button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.4);
        }

        .size-controls {
            background: #f7faff;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border: 1px solid #e8edf5;
        }

        .size-controls .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f2c47;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Адаптация для маленьких экранов */
        @media (max-width: 600px) {
            .slider-group label {
                min-width: 50px;
                font-size: 0.75rem;
            }
            .slider-value {
                min-width: 35px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬛ MRT PDF</h1>
        <div class="sub">Настройте пропорции элементов</div>

        <div class="style-toggle" id="styleToggle">
            <button class="active" data-style="old">📜 Старый стиль</button>
            <button data-style="new">✨ Новый стиль</button>
        </div>

        <!-- Настройки размеров -->
        <div class="size-controls">
            <div class="title">📐 Распределение высоты (%)</div>
            
            <div class="slider-group">
                <label>Цифра</label>
                <input type="range" id="sizeNumber" min="40" max="85" value="70" step="1">
                <span class="slider-value" id="sizeNumberVal">70%</span>
            </div>
            
            <div class="slider-group">
                <label>QR-код</label>
                <input type="range" id="sizeQR" min="10" max="40" value="20" step="1">
                <span class="slider-value" id="sizeQRVal">20%</span>
            </div>
            
            <div class="slider-group">
                <label>Название</label>
                <input type="range" id="sizeName" min="5" max="25" value="10" step="1">
                <span class="slider-value" id="sizeNameVal">10%</span>
            </div>
            
            <div class="slider-sum">
                Сумма: <span id="sumDisplay">100</span>%
            </div>
        </div>

        <div class="form-group">
            <label>🔢 Код MRT</label>
            <input type="text" id="mrtCode" value="960302247">
        </div>

        <div class="form-group">
            <label>📄 Количество листов</label>
            <input type="number" id="sheetCount" value="3" min="1" max="20">
        </div>

        <div class="form-group">
            <label>📝 Наименование</label>
            <input type="text" id="userName" value="КС">
        </div>

        <div class="preview-row">
            Пример QR: <code id="examplePreview">SQUA960302247MRT1</code>
        </div>

        <button class="btn" id="generateBtn">📄 Сгенерировать PDF</button>
        <button class="btn btn-secondary" id="clearBtn">✕ Очистить</button>

        <div class="status" id="statusMessage"></div>
        <div class="footer">Работает полностью в браузере</div>
    </div>

    <!-- ========== ШАБЛОН ========== -->
    <div id="pageTemplate">
        <div class="zone-number" id="zoneNumber">
            <div class="big-number" id="pageNumber">1</div>
            <div class="zone-label">⬆ Цифра</div>
        </div>

        <div class="zone-qr" id="zoneQR">
            <div class="qr-single" id="qrSingle"></div>
            <div class="zone-label">⬆ QR</div>
        </div>

        <div class="zone-name" id="zoneName">
            <div class="page-name" id="pageName">КС</div>
            <div class="zone-label">⬆ Название</div>
        </div>
    </div>

    <script>
        (function() {
            const mrtCodeInput = document.getElementById('mrtCode');
            const sheetCountInput = document.getElementById('sheetCount');
            const userNameInput = document.getElementById('userName');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusDiv = document.getElementById('statusMessage');
            const examplePreview = document.getElementById('examplePreview');

            // Слайдеры
            const sizeNumber = document.getElementById('sizeNumber');
            const sizeQR = document.getElementById('sizeQR');
            const sizeName = document.getElementById('sizeName');
            const sizeNumberVal = document.getElementById('sizeNumberVal');
            const sizeQRVal = document.getElementById('sizeQRVal');
            const sizeNameVal = document.getElementById('sizeNameVal');
            const sumDisplay = document.getElementById('sumDisplay');

            // Зоны шаблона
            const pageTemplate = document.getElementById('pageTemplate');
            const zoneNumber = document.getElementById('zoneNumber');
            const zoneQR = document.getElementById('zoneQR');
            const zoneName = document.getElementById('zoneName');
            const pageNumber = document.getElementById('pageNumber');
            const qrSingle = document.getElementById('qrSingle');
            const pageName = document.getElementById('pageName');

            let currentStyle = 'old';

            // Обновление отображения слайдеров
            function updateSliders() {
                let n = parseInt(sizeNumber.value);
                let q = parseInt(sizeQR.value);
                let nm = parseInt(sizeName.value);
                
                // Корректируем, чтобы сумма была 100%
                let sum = n + q + nm;
                if (sum !== 100) {
                    // Автокоррекция: меняем самый большой элемент
                    if (sum > 100) {
                        let diff = sum - 100;
                        let maxVal = Math.max(n, q, nm);
                        if (n === maxVal) { n = Math.max(40, n - diff); }
                        else if (q === maxVal) { q = Math.max(10, q - diff); }
                        else { nm = Math.max(5, nm - diff); }
                    } else {
                        let diff = 100 - sum;
                        let maxVal = Math.max(n, q, nm);
                        if (n === maxVal) { n = Math.min(85, n + diff); }
                        else if (q === maxVal) { q = Math.min(40, q + diff); }
                        else { nm = Math.min(25, nm + diff); }
                    }
                    // Обновляем значения слайдеров
                    sizeNumber.value = n;
                    sizeQR.value = q;
                    sizeName.value = nm;
                }
                
                sizeNumberVal.textContent = n + '%';
                sizeQRVal.textContent = q + '%';
                sizeNameVal.textContent = nm + '%';
                sumDisplay.textContent = n + q + nm;
            }

            // Обновление размеров зон в шаблоне
            function updateZones() {
                const n = parseInt(sizeNumber.value);
                const q = parseInt(sizeQR.value);
                const nm = parseInt(sizeName.value);
                
                zoneNumber.style.height = n + '%';
                zoneQR.style.height = q + '%';
                zoneName.style.height = nm + '%';
            }

            // События слайдеров
            [sizeNumber, sizeQR, sizeName].forEach(slider => {
                slider.addEventListener('input', function() {
                    updateSliders();
                    updateZones();
                });
            });

            // Переключатель стилей
            const styleButtons = document.querySelectorAll('#styleToggle button');
            styleButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    styleButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStyle = this.dataset.style;
                    updatePreview();
                    showStatus(`Стиль: ${currentStyle === 'old' ? 'Старый (SQUA...MRT)' : 'Новый (только код)'}`, 'ok');
                });
            });

            function showStatus(message, type = 'ok') {
                statusDiv.textContent = message;
                statusDiv.className = 'status show ' + type;
                setTimeout(() => { statusDiv.className = 'status'; }, 5000);
            }

            function getQRText(rawCode, index) {
                if (currentStyle === 'old') {
                    return `SQUA${rawCode}MRT${index}`;
                } else {
                    return rawCode;
                }
            }

            function updatePreview() {
                const code = mrtCodeInput.value.trim() || '960302247';
                examplePreview.textContent = getQRText(code, 1);
            }

            mrtCodeInput.addEventListener('input', updatePreview);
            updatePreview();

            // Генерация QR-кода с прозрачным фоном
            function generateSingleQR(text, container) {
                return new Promise((resolve) => {
                    container.innerHTML = '';
                    const qrDiv = document.createElement('div');
                    qrDiv.style.background = 'transparent';
                    qrDiv.style.padding = '0';
                    qrDiv.style.margin = '0';
                    container.appendChild(qrDiv);

                    try {
                        new QRCode(qrDiv, {
                            text: text,
                            width: 140,
                            height: 140,
                            colorDark: '#0b1a33',
                            colorLight: 'rgba(255,255,255,0)',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (e) {
                        qrDiv.innerHTML = 'QR error';
                    }

                    setTimeout(() => {
                        const canvas = qrDiv.querySelector('canvas');
                        if (canvas) {
                            canvas.style.background = 'transparent';
                            canvas.style.border = 'none';
                            canvas.style.outline = 'none';
                            canvas.style.boxShadow = 'none';
                        }
                        resolve();
                    }, 250);
                });
            }

            async function generatePDF() {
                const mrtCode = mrtCodeInput.value.trim();
                const sheetCount = parseInt(sheetCountInput.value) || 1;
                const userName = userNameInput.value.trim() || 'КС';

                if (!mrtCode) {
                    showStatus('❌ Введите код MRT', 'error');
                    return;
                }

                try {
                    showStatus('⏳ Генерация PDF...', 'ok');

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = 210;
                    const pageHeight = 297;

                    // Применяем размеры зон перед рендерингом
                    updateZones();

                    for (let i = 1; i <= sheetCount; i++) {
                        if (i > 1) doc.addPage();

                        const fullCode = getQRText(mrtCode, i);

                        pageNumber.textContent = String(i);
                        pageName.textContent = userName;

                        await generateSingleQR(fullCode, qrSingle);

                        const canvas = await html2canvas(pageTemplate, {
                            scale: 1.5,
                            useCORS: true,
                            logging: false,
                            width: 800,
                            height: 1131,
                            backgroundColor: '#ffffff',
                            onclone: (clonedDoc) => {
                                const labels = clonedDoc.querySelectorAll('.zone-label');
                                labels.forEach(el => el.style.display = 'none');
                                
                                const qrCanvas = clonedDoc.querySelector('#qrSingle canvas');
                                if (qrCanvas) {
                                    qrCanvas.style.background = 'transparent';
                                    qrCanvas.style.border = 'none';
                                    qrCanvas.style.outline = 'none';
                                    qrCanvas.style.boxShadow = 'none';
                                }
                            }
                        });

                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        doc.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                    }

                    doc.save(`MRT_${mrtCode}.pdf`);
                    showStatus(`✅ PDF создан! (${sheetCount} листов, стиль: ${currentStyle})`, 'ok');

                } catch (error) {
                    console.error(error);
                    showStatus(`❌ Ошибка: ${error.message}`, 'error');
                }
            }

            function clearAll() {
                mrtCodeInput.value = '960302247';
                sheetCountInput.value = '3';
                userNameInput.value = 'КС';
                
                // Сброс слайдеров к 70/20/10
                sizeNumber.value = 70;
                sizeQR.value = 20;
                sizeName.value = 10;
                updateSliders();
                updateZones();
                
                styleButtons.forEach(b => b.classList.remove('active'));
                document.querySelector('#styleToggle button[data-style="old"]').classList.add('active');
                currentStyle = 'old';
                updatePreview();
                showStatus('🧹 Очищено', 'ok');
            }

            // Инициализация
            updateSliders();
            updateZones();

            generateBtn.addEventListener('click', generatePDF);
            clearBtn.addEventListener('click', clearAll);

            document.querySelectorAll('input').forEach(el => {
                el.addEventListener('keydown', e => { if (e.key === 'Enter') generatePDF(); });
            });

            console.log('✅ Готово! Добавлена настройка пропорций элементов');
        })();
    </script>
</body>
</html>
